[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-integrity-intelligence"
version = "1.0.0"
description = "Evidence-first video intelligence platform (Meta-native video + web intelligence)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
# Full application stack (API server + persistence + provider + media).
# Basic library usage (`import vii`, local inspection/hashing/dataset
# validation) needs only the core dependencies above; heavier features
# declare their requirements here so library consumers do not have to
# install a server, database, or provider SDK they never use.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.18",
]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
provider = [
    "openai>=1.30",
    "httpx>=0.27",
]
media = [
    "Pillow>=10.0",
    "imagehash>=4.3",
]
app = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "openai>=1.30",
    "httpx>=0.27",
    "Pillow>=10.0",
    "imagehash>=4.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "openai>=1.30",
    "httpx>=0.27",
    "Pillow>=10.0",
    "imagehash>=4.3",
]
desktop = ["PySide6>=6.7", "keyring>=24"]
mcp = ["mcp>=2.0"]

[project.scripts]
vii = "vii.cli:main"
vii-api = "vii.api.app:run"
vii-mcp = "vii.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter config; keep noise low
